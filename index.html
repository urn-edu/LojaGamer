<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja The Witcher</title>
    <link rel="stylesheet" href="./src/css/estilo.css">
</head>
<body>
    <header>
        <h1 class="logo">LOJA<span>THE WITCHER</span></h1>
        <div class="menu-hamburguer" id="menu-icone">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <nav id="nav-menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Produtos</a></li>
                <li><a href="#">Contatos</a></li>
            </ul>
        </nav>

    </header>
    <!-- slide show-->
     <section id="banner">
        <img id="imgBanner">
     </section>

    <main class="container">
        <h2>Produtos em destaque</h2>
        <section class="card">
            <div class="card-game">
                <img src="./src/assets/l1.jpg" alt="Produto1">
                <article class="card-content">
                    <h2>Produto 1</h2>
                    <p class="preco">R$ 300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>

            <div class="card-game">
                <img src="./src/assets/p1.jpg" alt="Produto2">
                <article class="card-content">
                    <h2>Produto 2</h2>
                    <p class="preco">R$ 300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>

            <div class="card-game">
                <img src="./src/assets/t3.jpg" alt="Produto3">
                <article class="card-content">
                    <h2>Produto 3</h2>
                    <p class="preco">R$ 300,00</p>
                    <button class="btn-comprar">Comprar</button>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; -2026- LojaGamer - Direitos Reservados</p>
    </footer>
    <script src="./src/js/script.js"></script>
</body>
</html>
